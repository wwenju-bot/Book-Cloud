version : '3.8'
services:
  book-nacos:
    container_name: book-nacos
    image: nacos/nacos-server:v3.0.2
    build:
      context: ./nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_TOKEN=your_auth_token
      - NACOS_AUTH_IDENTITY_KEY=your_identity_key
      - NACOS_AUTH_IDENTITY_VALUE=your_identity_value
    volumes:
      - ./nacos/logs/:/home/nacos/logs
      - ./nacos/conf/application.properties:/home/nacos/conf/application.properties
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    depends_on:
      - book-mysql
  book-mysql:
    container_name: book-mysql
    image: mysql:5.7
    build:
      context: ./mysql
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/conf:/etc/mysql/conf.d
      - ./mysql/logs:/logs
      - ./mysql/data:/var/lib/mysql
    command: [
          'mysqld',
          '--innodb-buffer-pool-size=80M',
          '--character-set-server=utf8mb4',
          '--collation-server=utf8mb4_unicode_ci',
          '--default-time-zone=+8:00',
          '--lower-case-table-names=1'
        ]
    environment:
      MYSQL_DATABASE: 'book_db'
      MYSQL_ROOT_PASSWORD: password
  book-redis:
    container_name: book-redis
    image: redis
    build:
      context: ./redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/conf/redis.conf:/home/book/redis/redis.conf
      - ./redis/data:/data
    command: redis-server /home/book/redis/redis.conf
  book-nginx:
    container_name: book-nginx
    image: nginx
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/html/dist:/home/book/projects/book-ui
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/logs:/var/log/nginx
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - book-gateway
    links:
      - book-gateway
  book-gateway:
    container_name: book-gateway
    build:
      context: ./book/gateway
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - book-redis
    links:
      - book-redis
  book-auth:
    container_name: book-auth
    build:
      context: ./book/auth
      dockerfile: dockerfile
    ports:
      - "9200:9200"
    depends_on:
      - book-redis
    links:
      - book-redis
  book-modules-system:
    container_name: book-modules-system
    build:
      context: ./book/modules/system
      dockerfile: dockerfile
    ports:
      - "9201:9201"
    depends_on:
      - book-redis
      - book-mysql
    links:
      - book-redis
      - book-mysql
  book-modules-gen:
    container_name: book-modules-gen
    build:
      context: ./book/modules/gen
      dockerfile: dockerfile
    ports:
      - "9202:9202"
    depends_on:
      - book-mysql
    links:
      - book-mysql
  book-modules-job:
    container_name: book-modules-job
    build:
      context: ./book/modules/job
      dockerfile: dockerfile
    ports:
      - "9203:9203"
    depends_on:
      - book-mysql
    links:
      - book-mysql
  book-modules-file:
    container_name: book-modules-file
    build:
      context: ./book/modules/file
      dockerfile: dockerfile
    ports:
      - "9300:9300"
    volumes:
    - ./book/uploadPath:/home/book/uploadPath
  book-visual-monitor:
    container_name: book-visual-monitor
    build:
      context: ./book/visual/monitor
      dockerfile: dockerfile
    ports:
      - "9100:9100"
